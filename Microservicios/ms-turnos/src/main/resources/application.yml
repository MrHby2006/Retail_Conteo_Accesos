spring:
  application:
    name: ms-turnos
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/rinconsur_turnos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    username: ${DB_USUARIO:root}
    password: ${DB_CLAVE:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ms-turnos:${server.port}
