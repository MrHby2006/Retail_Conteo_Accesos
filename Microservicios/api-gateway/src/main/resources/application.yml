spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ms-usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**,/api/v1/roles/**

            - id: ms-turnos
              uri: lb://ms-turnos
              predicates:
                - Path=/api/v1/turnos/**,/api/v1/solicitudes/**

            - id: ms-notificaciones
              uri: lb://ms-notificaciones
              predicates:
                - Path=/api/v1/notificaciones/**

            - id: ms-accesos
              uri: lb://ms-accesos
              predicates:
                - Path=/api/v1/accesos/**,/api/v1/ingresos/**

            - id: ms-ventas
              uri: lb://ms-ventas
              predicates:
                - Path=/api/v1/compras/**

            - id: ms-reportes
              uri: lb://ms-reportes
              predicates:
                - Path=/api/v1/reportes/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/