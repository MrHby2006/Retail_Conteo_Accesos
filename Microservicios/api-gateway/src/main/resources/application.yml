spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios,/api/v1/usuarios/**,/api/v1/roles,/api/v1/roles/**

            - id: ms-turnos
              uri: lb://ms-turnos
              predicates:
                - Path=/api/v1/turnos,/api/v1/turnos/**,/api/v1/solicitudes/**

            - id: ms-notificaciones
              uri: lb://ms-notificaciones
              predicates:
                - Path=/api/v1/notificaciones,/api/v1/notificaciones/**

            - id: ms-accesos
              uri: lb://ms-accesos
              predicates:
                - Path=/api/v1/accesos,/api/v1/accesos/**,/api/v1/ingresos,/api/v1/ingresos/**

            - id: ms-reportes
              uri: lb://ms-reportes
              predicates:
                - Path=/api/v1/reportes/**,/api/v1/compras,/api/v1/compras/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: api-gateway:${server.port}
