spring:
  application:
    name: ms-notificaciones
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/rinconsur_notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    username: ${DB_USUARIO:root}
    password: ${DB_CLAVE:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000

correo:
  remitente: ${MAIL_REMITENTE:flujosur@rinconsur.cl}

server:
  port: 8083

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ms-notificaciones:${server.port}
