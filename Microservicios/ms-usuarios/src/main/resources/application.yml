spring:
  application:
    name: ms-usuarios
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/rinconsur_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    username: ${DB_USUARIO:root}
    password: ${DB_CLAVE:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ms-usuarios:${server.port}

fotos:
  carpeta: ${FOTOS_CARPETA:fotos}
